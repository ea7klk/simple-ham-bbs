apiVersion: apps/v1
kind: Deployment
metadata:
  name: bbs
  namespace: ham-bbs
  annotations:
    helm.sh/resource-policy: keep
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: bbs
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bbs
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - /usr/sbin/sshd
        - -D
        - -E
        - /var/log/auth.log
        command:
        - /sbin/tini
        - --
        - /usr/local/bin/docker-entrypoint.sh
        envFrom:
        - secretRef:
            name: bbs-smtp
        - secretRef:
            name: bbs-env
        image: ghcr.io/ea7klk/simple-ham-bbs@sha256:d77e90dacb43061aa0f866523b751db886aa47e8ce704cd196bad32970d8de2f
        imagePullPolicy: IfNotPresent
        name: bbs
        ports:
        - containerPort: 2222
          hostPort: 2222
          name: p2222-tcp
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 2222
          timeoutSeconds: 1
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
        startupProbe:
          failureThreshold: 180
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 2222
          timeoutSeconds: 1
        stdin: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        tty: true
        volumeMounts:
        - mountPath: /config/ssh
          name: v-c9a1e68f1b139838
        - mountPath: /var/lib/bbs
          name: v-daedbc100d077ade
        - mountPath: /dev/shm
          name: shm
        workingDir: /
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: registry-credentials
      nodeSelector:
        kubernetes.io/hostname: spainip-k3s
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 120
      volumes:
      - name: v-c9a1e68f1b139838
        persistentVolumeClaim:
          claimName: v-c9a1e68f1b139838
      - name: v-daedbc100d077ade
        persistentVolumeClaim:
          claimName: v-daedbc100d077ade
      - emptyDir:
          medium: Memory
          sizeLimit: '67108864'
        name: shm
---
apiVersion: v1
kind: Service
metadata:
  name: bbs
  namespace: ham-bbs
  annotations:
    helm.sh/resource-policy: keep
spec:
  clusterIP: 10.43.220.144
  clusterIPs:
  - 10.43.220.144
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: p2222-tcp
    port: 2222
    protocol: TCP
    targetPort: 2222
  selector:
    app.kubernetes.io/name: bbs
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bbs-web-hambbs
  namespace: ham-bbs
  annotations:
    helm.sh/resource-policy: keep
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`bbs.ea7klk.es`)
    services:
    - name: bbs-web
      port: 8080
  tls:
    certResolver: acmeresolver
