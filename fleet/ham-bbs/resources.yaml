apiVersion: apps/v1
kind: Deployment
metadata:
  name: bbs
  namespace: ham-bbs
  annotations:
    helm.sh/resource-policy: keep
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: bbs
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bbs
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - /usr/sbin/sshd
        - -D
        - -E
        - /var/log/auth.log
        command:
        - /sbin/tini
        - --
        - /usr/local/bin/docker-entrypoint.sh
        env:
        - name: BBS_APRS_EMBEDDED
          value: "false"
        envFrom:
        - secretRef:
            name: bbs-smtp
        - secretRef:
            name: bbs-env
        image: ghcr.io/ea7klk/simple-ham-bbs@sha256:fa9988ff382eb6a4a9bc215a586d591ec63da33a9980ef05a308e676a8cc4d58
        imagePullPolicy: IfNotPresent
        name: bbs
        ports:
        - containerPort: 2222
          hostPort: 2222
          name: p2222-tcp
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 2222
          timeoutSeconds: 1
        resources:
          requests:
            cpu: 25m
            memory: 64Mi
        startupProbe:
          failureThreshold: 180
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: 2222
          timeoutSeconds: 1
        stdin: true
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        tty: true
        volumeMounts:
        - mountPath: /config/ssh
          name: v-c9a1e68f1b139838
        - mountPath: /var/lib/bbs
          name: v-daedbc100d077ade
        - mountPath: /dev/shm
          name: shm
        workingDir: /
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: registry-credentials
      nodeSelector:
        kubernetes.io/hostname: spainip-k3s
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 120
      volumes:
      - name: v-c9a1e68f1b139838
        persistentVolumeClaim:
          claimName: v-c9a1e68f1b139838
      - name: v-daedbc100d077ade
        persistentVolumeClaim:
          claimName: v-daedbc100d077ade
      - emptyDir:
          medium: Memory
          sizeLimit: '67108864'
        name: shm
---
# APRS reception runs here, not inside the SSH service or the web app, so that
# redeploying either of those cannot interrupt it.
#
# The volume is ReadWriteOnce and provisioned by local-path, which pins it to one
# node; every pod that mounts it must therefore be scheduled to that node, hence
# the same nodeSelector as `bbs`. Several pods on the node may share a
# ReadWriteOnce claim — the restriction is per node, not per pod.
#
# Only one receiver may run at a time: two would write the same rows and both
# acknowledge the same message. `bbs_app` enforces that with an exclusive flock on
# the shared volume, so a rolling update hands over rather than overlapping: the
# replacement starts, waits for the lock, and takes over the moment the old pod
# exits. Reception stops for the moment it takes to release and re-acquire, not
# for the whole rollout.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bbs-aprs
  namespace: ham-bbs
  annotations:
    helm.sh/resource-policy: keep
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/name: bbs-aprs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: bbs-aprs
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - /usr/local/bin/bbs_app
        - aprs-supervisor
        command:
        - /sbin/tini
        - --
        - /usr/local/bin/docker-entrypoint.sh
        env:
        - name: BBS_SSH_ENABLED
          value: "false"
        - name: BBS_APRS_EMBEDDED
          value: "false"
        envFrom:
        - secretRef:
            name: bbs-smtp
        - secretRef:
            name: bbs-env
        image: ghcr.io/ea7klk/simple-ham-bbs@sha256:fa9988ff382eb6a4a9bc215a586d591ec63da33a9980ef05a308e676a8cc4d58
        imagePullPolicy: IfNotPresent
        name: bbs-aprs
        resources:
          requests:
            cpu: 10m
            memory: 48Mi
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /var/lib/bbs
          name: v-daedbc100d077ade
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: registry-credentials
      nodeSelector:
        kubernetes.io/hostname: spainip-k3s
      restartPolicy: Always
      schedulerName: default-scheduler
      # Long enough for an in-flight APRS-IS transaction to finish; short enough
      # that a rollout is not perceived as a gap in reception.
      terminationGracePeriodSeconds: 30
      volumes:
      - name: v-daedbc100d077ade
        persistentVolumeClaim:
          claimName: v-daedbc100d077ade
---
apiVersion: v1
kind: Service
metadata:
  name: bbs
  namespace: ham-bbs
  annotations:
    helm.sh/resource-policy: keep
spec:
  clusterIP: 10.43.220.144
  clusterIPs:
  - 10.43.220.144
  internalTrafficPolicy: Cluster
  ipFamilies:
  - IPv4
  ipFamilyPolicy: SingleStack
  ports:
  - name: p2222-tcp
    port: 2222
    protocol: TCP
    targetPort: 2222
  selector:
    app.kubernetes.io/name: bbs
  sessionAffinity: None
  type: ClusterIP
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: bbs-web-hambbs
  namespace: ham-bbs
  annotations:
    helm.sh/resource-policy: keep
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`bbs.ea7klk.es`)
    services:
    - name: bbs-web
      port: 8080
  tls:
    certResolver: acmeresolver
