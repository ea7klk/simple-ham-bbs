name: Test and Docker Image

# Runs on GitHub-hosted runners. This repository has no self-hosted runner
# registered, and the deployment host is a k3s cluster managed by Fleet — it has
# no Docker daemon, so no job here may assume `docker compose` on the host.
# Image delivery is: build and push to GHCR here, then pin the resulting digest
# in the GitOps repository (spainip/infra, fleet/managed-apps.yaml) that Fleet
# reconciles.

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  release:
    types:
      - published
  # Bootstrap and rebuild path: a release whose tag predates this workflow (such
  # as v1.20) cannot pick up the fixed pipeline, so the image can be built from a
  # branch or tag by hand. `version` is used as the image tag.
  workflow_dispatch:
    inputs:
      version:
        description: Image tag to publish (for example v1.20)
        required: true
        type: string

# Deny by default; each job requests only what it needs. `packages: write` lives
# on the docker job alone.
permissions:
  contents: read

# A superseded branch or pull-request run is cancelled so the queue cannot fill
# with stale work. A release build is never cancelled: the image it publishes is
# what the deployment pins.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source/bbs
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: source

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: source/bbs/go.mod
          cache-dependency-path: source/bbs/go.sum

      - name: Run tests with coverage
        run: |
          go test ./cmd/bbs -coverprofile=coverage.out -covermode=atomic
          go tool cover -func=coverage.out | tee coverage.txt
          go tool cover -html=coverage.out -o coverage.html
          echo "::group::Go coverage report"
          cat coverage.txt
          echo "::endgroup::"
          {
            echo "## Go coverage report"
            echo
            echo "[Download the HTML coverage report from the workflow artifacts.](#artifacts)"
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          coverage="$(awk '/^total:/ {gsub(/%/, "", $3); print $3}' coverage.txt)"
          awk -v coverage="$coverage" 'BEGIN {
            if (coverage + 0 < 60) {
              printf("Coverage %.1f%% is below required 60%%\n", coverage)
              exit 1
            }
            printf("Coverage %.1f%% meets required 60%%\n", coverage)
          }'

      - name: Upload coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: go-coverage-report
          path: |
            source/bbs/coverage.out
            source/bbs/coverage.txt
            source/bbs/coverage.html

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
      version: ${{ env.IMAGE_VERSION }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          path: source

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=${{ env.IMAGE_VERSION }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./source/bbs
          file: ./source/bbs/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record published digest
        run: |
          {
            echo "## Published image"
            echo
            echo '```'
            echo "${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
            echo '```'
            echo
            echo "Pin this digest in the GitOps repository Fleet reconciles:"
            echo '`spainip/infra` -> `fleet/managed-apps.yaml`.'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}

  # Fleet deploys from spainip/infra with `correctDrift` enabled and a
  # digest-pinned image reference, so a `kubectl set image` or a `docker compose`
  # call on the host would be reverted. The only durable way to ship a release is
  # to bump that digest in the GitOps repository.
  #
  # This job does that automatically when an `INFRA_REPO_TOKEN` secret (a fine
  # grained PAT with contents:write on spainip/infra) is configured. Without the
  # secret the job is skipped and the release must be pinned by hand; the
  # published digest is printed in the docker job summary either way.
  pin:
    name: Pin image digest in GitOps
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: docker
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    env:
      INFRA_REPO_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
      IMAGE_DIGEST: ${{ needs.docker.outputs.digest }}
      IMAGE_NAME: ${{ needs.docker.outputs.image }}
      IMAGE_VERSION: ${{ needs.docker.outputs.version }}
    steps:
      - name: Report missing deployment credential
        if: env.INFRA_REPO_TOKEN == ''
        run: |
          {
            echo "### Image published, GitOps pin skipped"
            echo
            echo "No \`INFRA_REPO_TOKEN\` secret is configured, so"
            echo "\`spainip/infra\` was not updated automatically."
            echo
            echo "Pin this reference in \`fleet/managed-apps.yaml\`:"
            echo
            echo '```'
            echo "${IMAGE_NAME}@${IMAGE_DIGEST}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=GitOps pin skipped::Set INFRA_REPO_TOKEN to automate the digest bump."

      - name: Check out GitOps repository
        if: env.INFRA_REPO_TOKEN != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: spainip/infra
          token: ${{ env.INFRA_REPO_TOKEN }}
          path: gitops

      - name: Pin published digest
        if: env.INFRA_REPO_TOKEN != ''
        working-directory: gitops
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys

          path = "fleet/managed-apps.yaml"
          image_name = os.environ["IMAGE_NAME"]
          digest = os.environ["IMAGE_DIGEST"]
          version = os.environ["IMAGE_VERSION"]

          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest or ""):
              sys.exit(f"unexpected digest: {digest!r}")

          with open(path, encoding="utf-8") as handle:
              original = handle.read()

          pattern = re.compile(re.escape(image_name) + r"@sha256:[0-9a-f]{64}")
          updated, count = pattern.subn(f"{image_name}@{digest}", original)
          if count == 0:
              sys.exit(f"no digest-pinned reference to {image_name} in {path}")
          if updated == original:
              print(f"{path} already pins {digest}; nothing to do")
              raise SystemExit(0)

          with open(path, "w", encoding="utf-8") as handle:
              handle.write(updated)
          print(f"pinned {count} reference(s) to {digest} for {version}")
          PY
          if git diff --quiet -- fleet/managed-apps.yaml; then
            echo "No change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fleet/managed-apps.yaml
          git commit -m "chore(ham-bbs): pin image to ${IMAGE_VERSION} (${IMAGE_DIGEST:0:19})"
          git push
