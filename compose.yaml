# Local development convenience only.
#
# This file is NOT used by the deployment. Production is a Fleet-managed k3s
# Deployment whose image is digest-pinned in spainip/infra. The tags below are
# floating on purpose: a workstation run should track whatever the registry
# serves. Do not promote this file to a deployment path without pinning by
# digest first. See README.md "Local development" and "Deployment".

services:
  hamnet:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: hamnet-wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Madrid
    ports:
      - "2222:2222/tcp"
    volumes:
      - ./hamnet/wg_confs:/config/wg_confs
      - /lib/modules:/lib/modules:ro
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
    restart: unless-stopped

  bbs:
    build:
      context: ./bbs
    container_name: hamnet-bbs
    network_mode: "service:hamnet"
    cap_add:
      - NET_ADMIN
    depends_on:
      - hamnet
    environment:
      - BBS_USER_PASSWORD=${BBS_USER_PASSWORD:-change-this-password}
      - BBS_GUEST_MODE=${BBS_GUEST_MODE:-false}
      - BBS_NAME=${BBS_NAME:-HAMNET RADIO BBS}
      - BBS_SYSOP=${BBS_SYSOP:-Sysop}
      - BBS_SYSOPS=${BBS_SYSOPS:-}
      - BBS_LOCATION=${BBS_LOCATION:-HamNet}
      - BBS_WELCOME_TOPIC=${BBS_WELCOME_TOPIC:-Amateur radio notes, local nets, and packet-era experiments}
      - BBS_DB_FILE=${BBS_DB_FILE:-/var/lib/bbs/bbs.sqlite}
      - APRS_IS_SERVER=${APRS_IS_SERVER:-rotate.aprs2.net}
      - APRS_IS_PORT=${APRS_IS_PORT:-14580}
      - APRS_RECEIVER_CALLSIGN=${APRS_RECEIVER_CALLSIGN:-}
      - BBS_SMTP_HOST=${BBS_SMTP_HOST:-}
      - BBS_SMTP_PORT=${BBS_SMTP_PORT:-587}
      - BBS_SMTP_SECURITY=${BBS_SMTP_SECURITY:-starttls}
      - BBS_SMTP_USERNAME=${BBS_SMTP_USERNAME:-}
      - BBS_SMTP_PASSWORD=${BBS_SMTP_PASSWORD:-}
      - BBS_SMTP_FROM=${BBS_SMTP_FROM:-}
      - BBS_SMTP_FROM_NAME=${BBS_SMTP_FROM_NAME:-HAMNET Radio BBS}
      - BBS_WEB_BASE_URL=${BBS_WEB_BASE_URL:-https://bbs.ea7lk.es}
      - BBS_FALLBACK_GATEWAY=${BBS_FALLBACK_GATEWAY:-172.18.0.1}
    volumes:
      - bbs-data:/var/lib/bbs
      - ./ssh:/config/ssh
    stdin_open: true
    tty: true
    restart: unless-stopped

volumes:
  bbs-data:
